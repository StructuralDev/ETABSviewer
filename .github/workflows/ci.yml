name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escaneo de secretos y binarios
        shell: pwsh
        run: ./.github/scripts/scan-secretos.ps1
      - name: Solo modelos cifrados
        shell: pwsh
        run: ./.github/scripts/verificar-modelos.ps1

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pruebas (sin dependencias)
        run: node --test tests/
      - name: Convertidor autónomo (pruebas y construcción)
        run: |
          python3 -m unittest discover -s tools -p "test_*.py" -v
          python3 tools/construir_convertidor.py
