<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Visor ETABS</title>
  <link rel="stylesheet" href="src/visor/estilo.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <section id="login">
    <form id="login-form" class="tarjeta-login" autocomplete="off">
      <img src="design/logo_alba.svg" alt="ALBA">
      <h1>Visor de modelos</h1>
      <p>Ingresa la contraseña que te compartieron para abrir los modelos.</p>
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required autofocus>
      <button id="login-boton" class="btn bloque" type="submit">Abrir modelos</button>
    </form>
    <div id="login-mensaje" class="error" role="alert" hidden></div>
  </section>

  <div id="app" hidden>
    <header>
      <img src="design/logo_alba.svg" alt="ALBA">
      <span id="titulo"></span>
      <select id="modelo-sel" aria-label="Modelo" hidden></select>
      <div class="grupo" role="group" aria-label="Vista">
        <button id="btn-3d" aria-pressed="true">3D</button>
        <select id="sel-planta" aria-label="Planta"></select>
        <select id="sel-alzado" aria-label="Alzado"></select>
      </div>
    </header>
    <main>
      <div id="lienzo"><div id="caja"></div></div>
      <aside id="panel" aria-live="polite"></aside>
    </main>
  </div>

  <script type="module" src="src/visor/principal.js"></script>
</body>
</html>
